<dialog id="review-dialog" aria-labelledby="review-title">
  <div class="review-toolbar"><div><span class="eyebrow">STRIPSHOT / PHOTO REVIEW</span><h2 id="review-title">Photo</h2></div><button id="review-close" autofocus aria-label="Close photo review">Close ✕</button></div>
  <div class="review-stage"><img id="review-image" alt="" hidden><p id="review-message" role="status">Loading photo…</p></div>
  <div class="review-controls"><button id="review-previous" aria-label="Previous image">← Previous</button><span id="review-count"></span><button id="review-next" aria-label="Next image">Next →</button><a id="review-original" target="_blank" rel="noopener">Full resolution ↗</a></div>
</dialog>
